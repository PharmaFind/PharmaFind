spring.application.name=pharmafind-backend

# Valores de conexão podem ser substituídos pelo ambiente; nenhum segredo é versionado.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pharmafind_demo}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# Mantém as sessões JDBC alinhadas às regras do banco (MySQL 8 e UTC).
spring.datasource.hikari.connection-init-sql=SET SESSION time_zone = '+00:00', SESSION sql_mode = CONCAT_WS(',', @@SESSION.sql_mode, 'STRICT_ALL_TABLES')

# Permite iniciar o servidor sem banco disponível; conexões serão necessárias ao acessar dados.
spring.datasource.hikari.initialization-fail-timeout=-1
